name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: KumoneIOS

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          for candidate in /Applications/Xcode_26.5.app /Applications/Xcode_26.5.0.app /Applications/Xcode.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Configure iOS
        run: |
          ./Scripts/configure-ios.sh

      - name: Build iOS App
        run: |
          cd ios
          xcodebuild clean build \
            -workspace KumoneIOS.xcworkspace \
            -scheme KumoneIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            IPHONEOS_DEPLOYMENT_TARGET=17.0

      - name: Create IPA
        run: |
          APP_PATH="$(find ios/build/DerivedData/Build/Products/Release-iphoneos -maxdepth 2 -name 'KumoneIOS.app' -type d -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "ERROR: KumoneIOS.app not found" >&2
            find ios/build/DerivedData/Build/Products -maxdepth 2 -type d -name "*.app" 2>/dev/null
            exit 1
          fi
          mkdir -p ios/build/IPA/Payload
          cp -R "$APP_PATH" ios/build/IPA/Payload/
          cd ios/build/IPA
          zip -qry ../KumoneIOS-unsigned.ipa Payload
          ls -lh ../KumoneIOS-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KumoneIOS-ipa
          path: ios/build/KumoneIOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
